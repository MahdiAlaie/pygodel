[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pygodel"
version = "0.1.0"
description = "A formal framework for Gödel numbering, syntax arithmetization, and verifiable reasoning in Python."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Mohammad Mahdi Alaie Bafqi", email = "your_email@example.com" }
]
keywords = [
    "logic",
    "godel-numbering",
    "formal-methods",
    "arithmetization",
    "mathematical-logic",
    "reasoning"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]

# وابستگی‌های اصلی؛ فعلاً صفر یا حداقل ممکن برای سبکی پکیج
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pygodel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 88
target-version = "py310"
